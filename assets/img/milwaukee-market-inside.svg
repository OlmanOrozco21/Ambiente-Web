<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 224" role="img" aria-labelledby="title desc">
  <title id="title">De la fachada a la mesa en Milwaukee Public Market</title>
  <desc id="desc">Reconoce la fachada desde St. Paul Avenue. Dentro, busca el extremo este: St. Paul Fish Company está junto a Thai-namite. Para sentarte, busca Palm Garden en el segundo nivel.</desc>
  <rect width="400" height="224" rx="12" fill="#eef6f4"/>
  <path d="M35 39v146" stroke="#86aaa0" stroke-width="3" stroke-dasharray="5 5"/>
  <g fill="#fff" stroke="#b6ceca">
    <rect x="58" y="14" width="326" height="56" rx="8"/>
    <rect x="58" y="84" width="326" height="56" rx="8"/>
    <rect x="58" y="154" width="326" height="56" rx="8"/>
  </g>
  <g fill="#155d4e">
    <circle cx="35" cy="42" r="15"/>
    <circle cx="35" cy="112" r="15"/>
    <circle cx="35" cy="182" r="15"/>
  </g>
  <g font-family="system-ui,sans-serif" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">
    <text x="35" y="48">1</text><text x="35" y="118">2</text><text x="35" y="188">3</text>
  </g>
  <g font-family="system-ui,sans-serif" font-size="16" fill="#173443">
    <text x="71" y="36" font-weight="800">St. Paul Ave &amp; Broadway</text>
    <text x="71" y="56">Letrero del Public Market</text>
    <text x="71" y="106" font-weight="800">St. Paul Fish Company</text>
    <text x="71" y="126">Extremo este · junto a Thai-namite</text>
    <text x="71" y="176" font-weight="800">Palm Garden</text>
    <text x="71" y="196">Segundo nivel · zona de mesas</text>
  </g>
</svg>
