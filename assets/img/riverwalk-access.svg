  <path d="M61 29v180M185 75v74M328 29v180" stroke="#647788" stroke-width="2" stroke-dasharray="4 5"/>
  <path d="M82 155v19h42M285 70V51h-81" fill="none" stroke="#13584a" stroke-width="2"/>
  <circle cx="82" cy="148" r="7" fill="#19614f" stroke="white" stroke-width="2"/>
  <circle cx="285" cy="80" r="7" fill="#19614f" stroke="white" stroke-width="2"/>
